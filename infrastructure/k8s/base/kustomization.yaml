apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.example.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - ingress.yaml

# erp-secrets is intentionally NOT listed here. secret.example.yaml only
# documents the required keys — create the real Secret at deploy time
# (see the instructions in secret.example.yaml) rather than letting
# kustomize apply anything with placeholder values.
