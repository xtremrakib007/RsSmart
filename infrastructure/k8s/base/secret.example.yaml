# Referenced by api-deployment.yaml's envFrom.secretRef (name: erp-secrets).
#
# DO NOT commit a real filled-in copy of this to git. Generate the real
# Secret at deploy time instead, e.g.:
#
#   kubectl create secret generic erp-secrets \
#     --namespace erp-production \
#     --from-literal=DATABASE_URL='postgresql://erp_user:REPLACE@postgres:5432/erp' \
#     --from-literal=JWT_SECRET='REPLACE' \
#     --from-literal=JWT_REFRESH_SECRET='REPLACE' \
#     --from-literal=REDIS_PASSWORD='REPLACE' \
#     --from-literal=SENTRY_DSN='REPLACE' \
#     --from-literal=SENDGRID_API_KEY='REPLACE' \
#     --from-literal=TWILIO_SID='REPLACE' \
#     --from-literal=TWILIO_TOKEN='REPLACE' \
#     --from-literal=TWILIO_PHONE='REPLACE' \
#     --from-literal=FIREBASE_SERVICE_ACCOUNT='REPLACE'
#
# or manage it via your secrets manager (Sealed Secrets / External Secrets
# Operator / Vault) instead of kubectl directly, so it isn't sitting in
# shell history either.
#
# This file just documents the required keys — see backend/.env.example
# for what each one is used for.
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp-production
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  SENTRY_DSN: "REPLACE_ME"
  SENDGRID_API_KEY: "REPLACE_ME"
  TWILIO_SID: "REPLACE_ME"
  TWILIO_TOKEN: "REPLACE_ME"
  TWILIO_PHONE: "REPLACE_ME"
  FIREBASE_SERVICE_ACCOUNT: "REPLACE_ME"
