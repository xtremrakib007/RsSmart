version: "3.9"

services:
  api:
    image: your-registry/erp-api:${TAG}
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '1.0', memory: 1G }
    environment:
      # Was `postgresql://postgres:5432/erp` — missing user/password/host,
      # would fail to connect on first deploy. Must match POSTGRES_USER/
      # POSTGRES_PASSWORD below.
      - DATABASE_URL=postgresql://erp_user:${DB_PASSWORD}@postgres:5432/erp?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # nginx-prod's upstream is `api:8080` (infrastructure/nginx-prod) and
      # the k8s Deployment probes containerPort 8080 — PORT must match.
      - PORT=8080
      - NODE_ENV=production
      - SENTRY_DSN=${SENTRY_DSN}
    networks: [erp-net]
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c hot_standby=on
    networks: [erp-net]

  postgres_replica:
    image: postgres:15-alpine
    volumes: [pg_replica:/var/lib/postgresql/data]
    environment:
      PGUSER: replicator
      PGPASSWORD: ${REPLICA_PASSWORD}
    command: >
      bash -c "
      pg_basebackup -h postgres -D /var/lib/postgresql/data -U replicator -v -P -W &&
      echo 'standby_mode = on' >> /var/lib/postgresql/data/recovery.conf &&
      echo 'primary_conninfo = host=postgres port=5432 user=replicator password=${REPLICA_PASSWORD}' >> /var/lib/postgresql/data/recovery.conf &&
      postgres
      "
    depends_on: [postgres]
    networks: [erp-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Previously had no auth at all — any container reachable on erp-net
    # could read/write cache, queue jobs, and sync state. requirepass closes
    # that off; REDIS_PASSWORD must be set in .env.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    networks: [erp-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/etc/letsencrypt
    depends_on: [api]
    networks: [erp-net]

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pg_data:
  pg_replica:
  redis_data:
  certbot_data:

networks:
  erp-net:
    driver: bridge
