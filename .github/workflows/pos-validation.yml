name: POS Android validation

on:
  push:
    branches: [feature/malaysia-pos-full-workflow]
    paths:
      - "pos-android/**"
      - ".github/workflows/pos-validation.yml"
  pull_request:
    paths:
      - "pos-android/**"
      - ".github/workflows/pos-validation.yml"

concurrency:
  group: pos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-pos:
    name: Android POS — build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build POS debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
        timeout-minutes: 30
      - name: Run POS unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
        timeout-minutes: 15
      - name: Upload POS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rssmart-pos-feature-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
