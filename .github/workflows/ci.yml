name: CI

# NOTE: Frontend projects (erp-windows, pos-windows) currently use
# `npm install` instead of `npm ci` because their package-lock.json files
# are not yet committed. After the first successful local install, commit
# the lockfiles and switch these jobs to `npm ci`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: lint, test, build, e2e
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      BILLPLZ_API_KEY: test-key
      BILLPLZ_X_SIGNATURE_KEY: test-sig
      BILLPLZ_COLLECTION_ID: test-collection
      BILLPLZ_SANDBOX: "true"
      # Prevent real outbound calls in CI
      META_CLOUD_API_URL: http://localhost:9999/mock-meta
      SENDGRID_API_KEY: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""
      SENTRY_DSN: ""
      # Phase 18 default trial plan — must match a seeded plan or signup fails
      DEFAULT_TRIAL_PLAN_SLUG: starter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify package-lock integrity
        run: |
          # npm ci will fail if package.json and package-lock.json are out of sync
          npm ci --prefer-offline --no-audit

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --ci --coverage --maxWorkers=2
        timeout-minutes: 10

      - name: E2E tests
        run: npm run test:e2e -- --maxWorkers=1
        timeout-minutes: 15

      - name: Build
        run: npm run build

      - name: Validate environment variables
        run: npm run validate:env
        env:
          NODE_ENV: production

      - name: Verify production readiness
        run: npm run verify:production

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Frontend: ERP Windows (Vite + Tauri)
  # ─────────────────────────────────────────────────────────────
  frontend-erp:
    name: Frontend — ERP Windows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp-windows/package-lock.json

      - name: Install dependencies
        # TODO: commit package-lock.json after first local install
        run: npm install --prefer-offline --no-audit

      - name: TypeScript check + Vite build
        run: npm run build

      # Tauri build requires Rust toolchain — skip in PR CI, run in release workflow
      # - name: Install Rust
      #   uses: dtolnay/rust-action@stable
      # - name: Tauri build
      #   run: npm run tauri:build

  # ─────────────────────────────────────────────────────────────
  # Frontend: POS Windows (Vite + Tauri)
  # ─────────────────────────────────────────────────────────────
  frontend-pos:
    name: Frontend — POS Windows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-windows/package-lock.json

      - name: Install dependencies
        # TODO: commit package-lock.json after first local install
        run: npm install --prefer-offline --no-audit

      - name: TypeScript check + Vite build
        run: npm run build
  # ─────────────────────────────────────────────────────────────
  # Android: Gradle build verification (Phase 31D)
  # ─────────────────────────────────────────────────────────────
  android-pos:
    name: Android — POS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        timeout-minutes: 15

      - name: Run unit tests
        run: ./gradlew test
        timeout-minutes: 10

  android-sales:
    name: Android — Sales
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        timeout-minutes: 15

      - name: Run unit tests
        run: ./gradlew test
        timeout-minutes: 10
